name: Buildin → табло
# Sender 1.2.2: verified Pages release, direct Telegram cards and separate menu.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать проверенный результат на текущем сайте?'
        type: boolean
        required: true
        default: false
      manage_preview:
        description: 'Проверить управление участницами до его включения?'
        type: boolean
        default: false
      bootstrap_digest:
        description: 'Только первый перенос: код сопоставления из проверенного предпросмотра'
        type: string
        default: ''
      notice_event:
        description: 'Служебный идентификатор отметки для личной ссылки; вручную оставить пустым'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '7 6,18 * * *'

permissions:
  contents: read

concurrency:
  group: buildin-board-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.BUILDIN_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      managed: ${{ steps.assemble.outputs.managed }}
    env:
      BUILDIN_PARTICIPANT_MANAGEMENT: ${{ vars.BUILDIN_PARTICIPANT_MANAGEMENT == 'true' || inputs.manage_preview }}
    steps:
      - name: Получить код табло
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Подготовить Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Проверить правила объединения
        env:
          BUILDIN_PARTICIPANT_MANAGEMENT: 'false'
        run: node --test tests/*.test.cjs

      - name: Прочитать сохранённую историю участия
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/participant-state.cjs fetch

      - name: Прочитать Buildin и собрать предварительное табло
        id: assemble
        env:
          BUILDIN_API_TOKEN: ${{ secrets.BUILDIN_API_TOKEN }}
          PARTICIPANT_BOOTSTRAP_DIGEST: ${{ inputs.bootstrap_digest }}
          PARTICIPANT_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: node scripts/buildin-board.cjs

      - name: Сохранить результат для просмотра
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tablo-preview
          path: |
            _site/
            sync-report.json
            sync-report.md
          if-no-files-found: error
          retention-days: 3

      - name: Передать проверенную историю для сохранения
        if: env.BUILDIN_PARTICIPANT_MANAGEMENT == 'true' && (github.event_name == 'schedule' || inputs.publish) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: participant-state-candidate
          path: |
            participant-state-candidate.json
            participant-state-meta.json
          if-no-files-found: error
          retention-days: 3

      - name: Подготовить проверенный сайт к публикации
        if: (github.event_name == 'schedule' || inputs.publish) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
          retention-days: 1

  preserve:
    needs: build
    if: needs.build.outputs.managed == 'true' && (github.event_name == 'schedule' || inputs.publish) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Получить проверенный код сохранения
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Подготовить Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Получить проверенный снимок этой сборки
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name participant-state-candidate --dir .participant-state
      - name: Сохранить историю перед публикацией
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/participant-state.cjs save

  deploy:
    needs: [build, preserve]
    if: always() && !cancelled() && needs.build.result == 'success' && (needs.preserve.result == 'success' || (needs.preserve.result == 'skipped' && needs.build.outputs.managed == 'false')) && (github.event_name == 'schedule' || inputs.publish) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить проверенный код уведомления
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Подготовить Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Обновить существующее табло
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Отправить личную ссылку после публикации
        if: github.event_name == 'workflow_dispatch' && inputs.notice_event != ''
        continue-on-error: true
        env:
          NOTICE_EVENT: ${{ inputs.notice_event }}
          NAVIGATOR_TELEGRAM_BOT_TOKEN: ${{ secrets.NAVIGATOR_TELEGRAM_BOT_TOKEN }}
          NAVIGATOR_ADMIN_TELEGRAM_ID: ${{ secrets.NAVIGATOR_ADMIN_TELEGRAM_ID }}
        run: node scripts/notify-publication.cjs
